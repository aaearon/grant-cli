name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        if: runner.os != 'Windows'
        run: make build

      - name: Test with race detector
        if: runner.os != 'Windows'
        run: make test-race

      # Windows runners have no GNU make, so run the equivalent go commands directly.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -trimpath -o grant.exe .

      - name: Test with race detector (Windows)
        if: runner.os == 'Windows'
        run: go test -race ./... -v

      # Integration tests drive the compiled binary as a child process. They
      # need no network and take ~2s, and they are the only place the real
      # argument parsing, exit codes and error text are exercised end to end.
      # Unguarded so both platforms are covered; the harness builds its own
      # binary into a temp dir.
      - name: Integration tests
        run: go test -tags=integration ./cmd -count=1 -v

      # The suite mutates package globals (bootstrapImpl, log,
      # ui.IsTerminalFunc). Randomising order is what surfaces a test that only
      # passes because another test ran first.
      - name: Test with shuffled order
        run: go test -shuffle=on -count=1 ./...

      # Runs on BOTH legs so the platforms stay comparable. This is the only
      # test that replaces a real, running executable, which is where Windows
      # and POSIX genuinely differ. It needs no network: the fixture binaries
      # are built locally from a dependency-free module.
      - name: Self-update end-to-end (binary replaces itself)
        run: go test -tags=selfupdate_e2e -run TestSelfUpdateE2E ./internal/selfupdate/ -v

      - name: Lint
        if: runner.os != 'Windows'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
